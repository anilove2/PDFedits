<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo — fixture</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(circle at 24% 22%, #dbeafe 0 18%, transparent 19%),
      radial-gradient(circle at 76% 68%, #c7d2fe 0 22%, transparent 23%),
      linear-gradient(145deg, #eff6ff 0%, #e0e7ff 48%, #f8fafc 100%);
    display: grid;
    place-items: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #1e293b;
  }
  .card {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid #dbe3ee;
    border-radius: 18px;
    padding: 48px 56px;
    box-shadow: 0 30px 60px -30px rgba(15, 23, 42, 0.5);
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: -1.5px; }
  p { margin: 0; color: #64748b; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Scan 001</h1>
    <p>A synthetic image for the images-to-PDF fixture.</p>
  </div>
</body>
</html>
